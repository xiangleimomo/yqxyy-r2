<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>TMDB OneClick Player 设置</title>
<style>body{margin:32px auto;padding:0 22px;max-width:800px;background:#f7fafc;color:#182335;font:15px/1.7 system-ui,sans-serif}h1{margin:0 0 8px}p{color:#607185}label{display:block;font-weight:650;margin:16px 0 5px}input{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px;padding:11px;font-size:14px}button{padding:11px 18px;border:0;border-radius:9px;background:#16845b;color:white;cursor:pointer;font-weight:700}code{background:#e8eff4;padding:2px 4px}#note{color:#166534}select{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px;padding:11px;background:white}</style></head>
<body><h1>影仓 · TMDB OneClick Player v3</h1><p>直接增强 TMDB 原网站，不建立另一套影视数据库。</p><label for="displayMode">默认显示模式</label><select id="displayMode"><option value="original">原版模式</option><option value="simple">精简模式（默认）</option><option value="poster">海报模式</option></select><p>也可在 TMDB 网站左下角随时切换。</p><p>默认源复用 yqxyy-r2 的 TMDB ID → HLS 地址生成规则。仅使用你有权访问的播放源。</p>
<label>电影播放地址模板</label><input id="movie">
<label>电视剧播放地址模板</label><input id="tv">
<label>电影备用模板（可留空）</label><input id="movieBackup">
<label>电视剧备用模板（可留空）</label><input id="tvBackup">
<p>支持 <code>{id}</code>、<code>{season}</code>、<code>{episode}</code>。默认只授权访问 api.obj2.top 域名，其他域名需修改扩展 manifest.json 权限后重载。</p>
<button id="save" type="button">保存设置</button> <button id="reset" type="button">恢复默认</button><p id="note" role="status"></p>
<script src="options.js"></script></body></html>
