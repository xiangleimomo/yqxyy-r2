<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMDB OneClick Player</title><link rel="stylesheet" href="player.css">
</head>
<body>
<main>
  <div class="top">
    <div><strong id="name">TMDB OneClick Player</strong><small id="identifier"></small></div>
    <a id="settings" href="options.html" target="_blank" rel="noopener">设置</a>
  </div>
  <section class="screen">
    <video id="video" controls playsinline preload="metadata"></video>
  </section>
  <section class="controls">
    <div class="pair" id="episodes" hidden>
      <label>季 <input id="season" type="number" min="1" max="999" value="1" inputmode="numeric"></label>
      <label>集 <input id="episode" type="number" min="1" max="9999" value="1" inputmode="numeric"></label>
    </div>
    <label>播放线路 <select id="line"><option value="primary">主线路</option><option value="backup">备用线路</option></select></label>
    <label>字幕 <select id="captions"><option value="-1">关闭字幕</option></select></label>
    <button id="play" type="button">▶ 重新加载</button>
  </section>
  <p id="status" role="status" aria-live="polite">播放器初始化中…</p>
  <details><summary>播放诊断 / 视频地址</summary><p id="address"></p><p id="error-detail"></p></details>
</main>
<script src="vendor/hls.min.js"></script><script src="player.js"></script>
</body>
</html>
