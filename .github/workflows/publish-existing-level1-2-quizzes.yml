name: Repair Existing Level 1-2 Little Fox Quizzes Only
on:
  push:
    paths:
      - quiz-updates/level1-2-existing-20261110.publish
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Repair only eight preexisting low-level quizzes; never create missing Quiz
        run: node scripts/publish-level1-2-existing-quizzes.mjs
