name: Read Rocket Girl Source for Offline Editorial Drafting
on:
  push:
    paths:
      - 'scripts/quiz-revisions/rocket-girl-read-preview.mjs'
      - '.github/workflows/preview-rocket-girl-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/quiz-revisions/rocket-girl-read-preview.mjs
