name: Little Fox Collect Handoff for ChatGPT
# GitHub gathers official sources; ChatGPT writes and reviews educational materials.
# Beijing 14:50 primary / 15:05 backup (UTC 06:50 / 07:05). Backup skips if today's inbox exists.
on:
  schedule:
    - cron: '50 6 * * 1-5'
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: littlefox-collect-handoff
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check today's handoff before collecting
        id: handoff
        shell: bash
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          if [ "${{ github.event.schedule }}" = "5 7 * * 1-5" ] && [ -f "automation/littlefox-daily/inbox/${today}.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Backup skipped: today's inbox already exists." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.handoff.outputs.skip != 'true'
        run: npm ci --omit=dev
      - name: Verify official releases and prepare metadata
        id: collect
        if: steps.handoff.outputs.skip != 'true'
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node automation/littlefox-daily/collect-handoff.mjs
      - name: Check official parser regression tests (blocking)
        if: always() && steps.handoff.outputs.skip != 'true'
        run: node --test automation/littlefox-daily/core.test.mjs
      - name: Upload short-lived verified source package for ChatGPT
        if: always() && steps.handoff.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: littlefox-source-${{ github.run_id }}
          path: /tmp/littlefox-source-*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Commit small metadata inbox (no full texts)
        if: always() && steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/littlefox-daily/inbox/*.json
          if ! git diff --cached --quiet; then
            git commit -m "data(littlefox): update official handoff metadata"
            git push origin HEAD:main
          fi
      - name: Surface collector errors
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collector blocked; no course published.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
