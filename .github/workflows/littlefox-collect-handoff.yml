name: Little Fox Collect Handoff for ChatGPT
# GitHub gathers official sources; ChatGPT writes and reviews educational materials.
# Weekday primary 15:03 and recovery checks 15:13/15:23, all Asia/Shanghai local time.
on:
  schedule:
    - cron: '55 16 13 11 *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: littlefox-collect-handoff
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record trigger diagnostics
        env:
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: |
          {
            echo "### Little Fox collector trigger"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Schedule: ${SCHEDULE_CRON:-manual}"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- China time: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Skip only when today's handoff is complete
        id: handoff
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
          }).formatToParts(new Date());
          const part = (type) => parts.find(x => x.type === type)?.value;
          const date = `${part('year')}-${part('month')}-${part('day')}`;
          const file = `automation/littlefox-daily/inbox/${date}.json`;
          let skip = false;
          if (fs.existsSync(file)) {
            try {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const items = Array.isArray(data.items) ? data.items : [];
              const retryable = items.some(x => ['blocked', 'awaiting_video'].includes(x.status));
              const statusesComplete = items.length > 0 && items.every(x => ['ready_for_chatgpt', 'already_published'].includes(x.status));
              const artifactUploaded = data.privateArtifactUploaded === true && Boolean(data.privateArtifactId) && Boolean(data.privateArtifactName);
              const noRelease = data.status === 'no_release_detected' && artifactUploaded;
              const complete = data.status === 'checked' && !retryable && statusesComplete && artifactUploaded;
              skip = noRelease || complete;
              console.log(JSON.stringify({date, file, status: data.status, retryable, statusesComplete, artifactUploaded, skip}));
            } catch (error) {
              console.log(`Existing inbox is unreadable; retrying collection: ${error.message}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          NODE
      - name: Install dependencies
        if: steps.handoff.outputs.skip != 'true'
        run: npm ci --omit=dev
      - name: Verify official releases and prepare metadata (retry transient failures)
        id: collect
        if: steps.handoff.outputs.skip != 'true'
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          rc=1
          for attempt in 1 2 3; do
            echo "Collector attempt ${attempt}/3"
            if node automation/littlefox-daily/collect-handoff.mjs; then
              exit 0
            else
              rc=$?
              echo "Collector attempt ${attempt} failed with exit code ${rc}"
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit "$rc"
      - name: Check official parser regression tests (blocking)
        if: always() && steps.handoff.outputs.skip != 'true'
        run: node --test automation/littlefox-daily/core.test.mjs
      - name: Upload short-lived source package
        id: source_artifact
        if: always() && steps.handoff.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: littlefox-source-${{ github.run_id }}
          path: /tmp/littlefox-source-*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Commit inbox only after source artifact upload succeeds
        if: always() && steps.collect.outcome == 'success' && steps.source_artifact.outcome == 'success' && steps.source_artifact.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.source_artifact.outputs.artifact-id }}
          ARTIFACT_NAME: littlefox-source-${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          inbox="automation/littlefox-daily/inbox/$(TZ=Asia/Shanghai date +%F).json"
          node - "$inbox" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          if (!fs.existsSync(file)) throw new Error(`Expected inbox file missing: ${file}`);
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const items = Array.isArray(data.items) ? data.items : [];
          data.privateArtifactId = process.env.ARTIFACT_ID;
          data.privateArtifactName = process.env.ARTIFACT_NAME;
          data.privateArtifactUploaded = true;
          data.sourceReadyCount = items.filter(x => x.status === 'ready_for_chatgpt' && x.sourceArtifact === true).length;
          data.retryableItemCount = items.filter(x => ['blocked', 'awaiting_video'].includes(x.status)).length;
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          console.log(JSON.stringify({date: data.date, runId: process.env.RUN_ID, artifactId: data.privateArtifactId, sourceReadyCount: data.sourceReadyCount, retryableItemCount: data.retryableItemCount}));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$inbox"
          if ! git diff --cached --quiet; then
            git commit -m "data(littlefox): update verified official handoff metadata"
            git push origin HEAD:main
          fi
      - name: Surface collector errors
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collector blocked after three attempts; no course published.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Report skipped duplicate handoff
        if: steps.handoff.outputs.skip == 'true'
        run: echo 'A complete handoff and one-day source artifact already exist for today; duplicate collection skipped.' >> "$GITHUB_STEP_SUMMARY"
