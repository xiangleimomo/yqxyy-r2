name: Little Fox Collect Handoff for ChatGPT
# GitHub gathers official sources; ChatGPT writes and reviews educational materials.
# 15:00 Beijing, before ChatGPT's 15:30 scheduled lesson task.
on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'automation/littlefox-daily/blind-test-request.json'
permissions:
  contents: write
concurrency:
  group: littlefox-collect-handoff
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - name: Verify official releases and prepare metadata
        id: collect
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LF_BLIND_TEST: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node automation/littlefox-daily/collect-handoff.mjs
      - name: Upload short-lived verified source package for ChatGPT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlefox-source-${{ github.run_id }}
          path: /tmp/littlefox-source-*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Commit small metadata inbox (no full texts)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/littlefox-daily/inbox/*.json
          if ! git diff --cached --quiet; then
            git commit -m "data(littlefox): update official handoff metadata"
            git push origin HEAD:main
          fi
      - name: Surface collector errors
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collector blocked; no course published.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
