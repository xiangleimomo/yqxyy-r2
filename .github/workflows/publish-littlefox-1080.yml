name: Publish Little Fox 1080P Upgrades to R2
on:
  push:
    paths:
      - data-patches/littlefox-1080-publish.request
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Back up R2, publish 871 1080P sources, preserve 720P fallback and verify public routes
        run: node scripts/publish-littlefox-1080-r2.mjs
