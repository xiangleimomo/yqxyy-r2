name: Check R2 website
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    # PAUSED: Generic push/PR build checks are not part of the Little Fox V2 production chain; retained for audit but paused.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --check js/app.js
      - name: Verify resources are not tracked
        run: test -z "$(git ls-files data/)"
