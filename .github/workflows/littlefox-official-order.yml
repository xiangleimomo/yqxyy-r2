name: Little Fox Preserve IDs Official Order
on:
  push:
    paths:
      - 'automation/littlefox-backfill/official-order-request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: littlefox-r2-official-order-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - name: Check safe migration syntax
        run: node --check automation/littlefox-backfill/apply-official-order.mjs
      - name: Preserve legacy IDs and attach official order with R2 backups
        run: node automation/littlefox-backfill/apply-official-order.mjs
      - name: Retain migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlefox-official-order-${{ github.run_id }}
          path: /tmp/littlefox-official-order-report.json
          if-no-files-found: warn
          retention-days: 7
