name: Publish Three Kingdoms 14-Episode Quiz V2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Publish reviewed Three Kingdoms quizzes and verify R2 and Netlify
        run: node scripts/publish-three-kingdoms-quiz-v2.mjs
