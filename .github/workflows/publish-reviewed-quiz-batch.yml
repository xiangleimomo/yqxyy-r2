name: Publish Reviewed Little Fox V2 Quiz Batch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Publish Cinderella reviewed quizzes to R2
        run: node scripts/publish-reviewed-quiz-batch.mjs cinderella
      - name: Publish Snow White reviewed quizzes to R2
        run: node scripts/publish-reviewed-quiz-batch.mjs snowwhite
