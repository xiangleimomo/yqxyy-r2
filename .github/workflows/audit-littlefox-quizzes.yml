name: Audit Little Fox R2 Quiz Quality
on:
  push:
    paths:
      - audits/quiz-review-2026-11-09.request
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit all series quiz data without writing to R2
        run: node scripts/audit-r2-littlefox-quizzes.mjs
