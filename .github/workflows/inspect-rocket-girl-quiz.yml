name: Inspect Rocket Girl Quiz and Source
on:
  push:
    paths:
      - 'scripts/inspect-rocket-girl-quiz.mjs'
      - '.github/workflows/inspect-rocket-girl-quiz.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LF_OPENAI_API_KEY: ${{ secrets.LF_OPENAI_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-rocket-girl-quiz.mjs
