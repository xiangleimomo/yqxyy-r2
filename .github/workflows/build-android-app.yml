name: Build YQXYY Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'js/mobile-caption-fullscreen.js'
      - 'js/desktop-player.js'
      - 'js/app.js'
      - 'js/app-updates.js'
      - 'js/mobile-app.js'
      - 'css/mobile-app.css'
      - 'netlify/functions/movie-tv-seasons.js'
      - 'tests/kids-update.test.cjs'
      - 'tests/tmdb-tv-seasons.test.cjs'
      - 'tests/tvmaze-episode-autofill.test.cjs'
      - 'tests/PlayerAdGuardTest.java'
      - 'js/movie-library.js'
      - 'js/movie-subtitles.js'
      - 'js/movies.js'
      - 'js/media-shelf.js'
      - 'tests/movie-tv-batch.test.cjs'
      - 'tests/movie-tv-admin.browser.cjs'
      - 'tests/subtitle-position-offset.test.cjs'
      - 'css/unified-player.css'
      - 'css/reader-enhancements.css'
      - 'js/books.js'
      - 'css/movies.css'
      - 'tests/movie-player-layout.browser.cjs'
      - 'tests/android-tmdb-providers.test.cjs'
      - '.github/workflows/build-android-app.yml'

concurrency:
  group: yqxyy-android-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js for GitHub website snapshot
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle latest website from this GitHub commit into APK
        run: |
          npm run build
          mkdir -p android/app/src/main/assets/site
          cp -a dist/. android/app/src/main/assets/site/
          test -f android/app/src/main/assets/site/index.html
          test -f android/app/src/main/assets/site/js/mobile-caption-fullscreen.js
          test -f android/app/src/main/assets/site/css/unified-player.css
      - name: Verify Android player and fullscreen bridge
        run: |
          node --check js/mobile-caption-fullscreen.js
          node --check js/desktop-player.js
          node --check js/app.js
          node --check js/mobile-app.js
          node --check js/app-updates.js
          node --check netlify/functions/movie-tv-seasons.js
          node --check js/movie-subtitles.js
          node --check js/movie-library.js
          node --check js/movies.js
          node --check js/media-shelf.js
          node --test tests/android-tmdb-providers.test.cjs tests/android-player-bridge.test.cjs tests/movie-tv-batch.test.cjs tests/subtitle-position-offset.test.cjs tests/kids-update.test.cjs tests/tmdb-tv-seasons.test.cjs tests/tvmaze-episode-autofill.test.cjs
          mkdir -p /tmp/yqxyy-adguard-tests
          javac -d /tmp/yqxyy-adguard-tests android/app/src/main/java/com/yqxyy/english/PlayerAdGuard.java tests/PlayerAdGuardTest.java
          java -cp /tmp/yqxyy-adguard-tests PlayerAdGuardTest
      - name: Install website test dependencies
        run: npm ci --no-audit --no-fund
      - name: Browser-check movie editor and in-video subtitles
        run: |
          node tests/movie-source-editor.browser.cjs
          node tests/movie-tv-admin.browser.cjs
          node tests/movie-player-layout.browser.cjs
      - name: Install required Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug -PbuildSha="$GITHUB_SHA"
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YQXYY-Android.apk
      - name: Upload test APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: YQXYY-Android-APK
          path: YQXYY-Android.apk
          retention-days: 30
      - name: Publish direct download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=android-app-latest
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" android/app/build.gradle | head -1)
          test -n "$VERSION"
          NOTES=$(printf 'Version: v%s\nCommit: %s\n\n安卓测试版；基于 GitHub 最新代码构建，课程资料仍从 R2 获取。\n安装包采用测试签名，跨次构建如提示签名不符需卸载旧测试版。' "$VERSION" "$GITHUB_SHA")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "YQXYY-Android.apk" --clobber
            gh release edit "$TAG" --title "一起学英语 Android APP v$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "YQXYY-Android.apk" \
              --title "一起学英语 Android APP v$VERSION" \
              --notes "$NOTES" \
              --prerelease
          fi
