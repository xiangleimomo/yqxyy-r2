name: Little Fox Nov 10 Official Read-Only Probe
on:
  push:
    paths:
      - 'automation/littlefox-daily/probe-request.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and run read-only official source probe
        run: |
          node --check automation/littlefox-daily/probe-today.mjs
          node automation/littlefox-daily/probe-today.mjs
      - name: Persist source-check report, even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlefox-official-readonly-probe-${{ github.run_id }}
          path: /tmp/littlefox-today-probe.json
          if-no-files-found: ignore
          retention-days: 7
