name: Fix Nero Episode 11 Storybook in R2
# One-time repair completed successfully on 2026-11-09.
# Disabled after publication; leave for audit but do not run automatically.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-book:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Repair only Nero 11 PDF catalogue entry and verify the public reader
        run: node scripts/fix-nero-11-book.mjs
