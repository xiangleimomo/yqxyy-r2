name: Publish Little Fox Course Patch to R2
on:
  workflow_dispatch:
    inputs:
      patch:
        description: Course patch to publish
        required: true
        type: choice
        options:
          - nero-fs0183-episode-011
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_COURSE_ZIP_B64_FILE: course-patches/nero-fs0183-episode-011.zip.b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate official Little Fox sources, merge indexes, and publish to R2
        if: ${{ inputs.patch == 'nero-fs0183-episode-011' }}
        run: node scripts/r2-course-upload-temp.mjs
