name: Publish Little Fox Course Patch to R2
on:
  push:
    paths:
      - course-patches/nero-fs0183-episode-011.publish
  workflow_dispatch:
    inputs:
      patch:
        description: Course patch to publish
        required: true
        type: choice
        options:
          - nero-fs0183-episode-011
permissions:
  contents: read
jobs:
  publish:
    # PAUSED: Legacy one-off Nero course patch publisher is superseded by the reviewed outbox publisher; retained for audit but paused.
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_COURSE_ZIP_B64_FILE: course-patches/nero-fs0183-episode-011.zip.b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Assemble and verify course patch archive
        if: ${{ github.event_name == 'push' || inputs.patch == 'nero-fs0183-episode-011' }}
        run: |
          cat course-patches/parts/01.txt course-patches/parts/02.txt course-patches/parts/03.txt course-patches/parts/04.txt course-patches/parts/05.txt course-patches/parts/06.txt course-patches/parts/07.txt course-patches/parts/08.txt course-patches/parts/09.txt course-patches/parts/10.txt > course-patches/nero-fs0183-episode-011.zip.b64
          base64 --decode course-patches/nero-fs0183-episode-011.zip.b64 > /tmp/nero-fs0183-episode-011.zip
          unzip -t /tmp/nero-fs0183-episode-011.zip
      - name: Check publisher script syntax
        run: node --check scripts/r2-course-upload-temp.mjs
      - name: Validate official Little Fox sources, merge indexes, and publish to R2
        if: ${{ github.event_name == 'push' || inputs.patch == 'nero-fs0183-episode-011' }}
        run: node scripts/r2-course-upload-temp.mjs
