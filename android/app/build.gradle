plugins {
  id 'com.android.application'
}
def buildSha = (project.findProperty('buildSha') ?: 'unknown').toString().replaceAll('[^0-9a-f]', '')
def websiteUrl = (project.findProperty('websiteUrl') ?: 'https://yqxyy-r2.netlify.app/').toString()
if (!websiteUrl.startsWith('https://')) throw new GradleException('The website URL must use HTTPS')
android {
  namespace 'com.yqxyy.english'
  compileSdk 35
  defaultConfig {
    applicationId 'com.yqxyy.english'
    minSdk 24
    targetSdk 34
    versionCode 10
    versionName '1.6.2'
    buildConfigField 'String', 'APP_URL', '"' + websiteUrl + '"'
    buildConfigField 'String', 'APP_BUILD_SHA', '"' + buildSha + '"'
  }
  buildFeatures { buildConfig true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
